<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Accueil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="home-container">
    <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

    <ion-text color="danger" *ngIf="errorMessage">
      <p class="error-message">{{ errorMessage }}</p>
    </ion-text>

    <ion-card *ngIf="user">
      <ion-card-header>
        <ion-card-title>Bonjour, {{ user.name }}</ion-card-title>
        <ion-card-subtitle>Vos informations personnelles</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-list lines="none">
          <ion-item>
            <ion-label>
              <h3>E-mail</h3>
              <p>{{ user.email }}</p>
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-label>
              <h3>Devise</h3>
              <p>{{ user.currency }}</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>

    <ion-button expand="block" routerLink="/account" class="account-button">
      Créditer ou débiter
    </ion-button>
    <ion-button expand="block" fill="outline" color="medium" [disabled]="isLoggingOut" (click)="logout()">
      {{ isLoggingOut ? 'Déconnexion…' : 'Déconnexion' }}
    </ion-button>
  </div>
</ion-content>
