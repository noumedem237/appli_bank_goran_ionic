<ion-header>
  <ion-toolbar class="account-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Accueil"></ion-back-button>
    </ion-buttons>
    <ion-title>Opérations</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="account-container">
    <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

    <section class="account-intro" *ngIf="user">
      <p class="eyebrow">COMPTE PRINCIPAL</p>
      <h1>Gérez votre solde</h1>
    </section>

    <ion-card *ngIf="user" class="balance-card">
      <ion-card-header>
        <ion-card-subtitle>Solde disponible</ion-card-subtitle>
        <ion-card-title>{{ user.balance ?? 0 }} {{ user.currency }}</ion-card-title>
      </ion-card-header>
    </ion-card>

    <form [formGroup]="form" novalidate class="operation-form">
      <p class="form-title">Nouvelle opération</p>
      <p class="form-help">Indiquez le montant à créditer ou à débiter.</p>
      <ion-item>
        <ion-input
          label="Montant"
          labelPlacement="stacked"
          type="number"
          inputmode="decimal"
          min="0.01"
          placeholder="0,00"
          formControlName="amount">
        </ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="form.controls.amount.touched && form.controls.amount.hasError('required')">Le montant est obligatoire.</ion-note>
      <ion-note color="danger" *ngIf="form.controls.amount.touched && form.controls.amount.hasError('min')">Le montant doit être supérieur à 0.</ion-note>

      <div class="actions">
        <ion-button type="button" expand="block" [disabled]="form.invalid || isSubmitting" (click)="credit()">
          <ion-spinner *ngIf="isSubmitting" name="crescent" slot="start"></ion-spinner>
          Créditer
        </ion-button>
        <ion-button type="button" expand="block" color="secondary" [disabled]="form.invalid || isSubmitting" (click)="debit()">
          <ion-spinner *ngIf="isSubmitting" name="crescent" slot="start"></ion-spinner>
          Débiter
        </ion-button>
      </div>
    </form>
  </div>

  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [color]="toastColor"
    duration="2800"
    position="top"
    (didDismiss)="dismissToast()">
  </ion-toast>
</ion-content>
